<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Chatbot</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('https://i.postimg.cc/j2d55Z60/Dark-Blue-Futuristic-How-Artificial-Intelligence-Youtube-Thumbnail-20240809-143502-0000.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #chatbox {
            width: 100%;
            max-width: 410px;
            background-color: rgba(26, 26, 26, 0.9);
            border-radius: 8px;
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(26, 26, 26, 0.9), rgba(26, 26, 26, 0.9)), radial-gradient(circle at top left, #00cfff, #0099ff);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            top: 35%;
            left: 20%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 999;
        }
        #title {
            background-color: #00cfff;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 20px;
            background-image: linear-gradient(45deg, #0099ff, #00cfff);
            animation: gradientBackground 3s ease infinite;
        }
        #chat-content {
            padding: 10px;
            height: 60vh;
            overflow-y: auto;
            flex-grow: 1;
        }
        .message {
            padding: 10px;
            margin: 5px 0;
            border-radius: 25px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user {
            text-align: right;
            background-color: #0099ff;
            color: white;
            align-self: flex-end;
        }
        .bot {
            text-align: left;
            background-color: #6c757d;
            color: white;
            align-self: flex-start;
        }
        #input-area {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #00cfff;
        }
        #user-id, #user-input {
            width: 45%;
            padding: 0.5px;
            border: none;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: white;
            margin-right: 5px;
        }
        #send-button, #voice-button {
            background: none;
            border: none;
            cursor: pointer;
            transition: box-shadow 0.3s ease;
        }
        #send-button img, #voice-button img {
            width: 24px;
            height: 24px;
        }
        #send-button:hover, #voice-button:hover {
            box-shadow: 0 0 10px #00cfff, 0 0 20px #00cfff, 0 0 30px #00cfff;
        }
        .typing-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin: 0 2px;
            background-color: #6c757d;
            border-radius: 50%;
            animation: typing 1s infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typing {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        @keyframes gradientBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #chatbox.show {
            transform: translate(-50%, -50%) scale(1);
        }
        #chat-toggle {
            position: relative;
            top: 45%;
            right: 10%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: #00cfff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: bounce 2s infinite;
        }
        #chat-toggle img {
            width: 32px;
            height: 32px;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-15px);
            }
            60% {
                transform: translateY(-7px);
            }
        }
    </style>
</head>
<body>
    <div id="chatbox">
        <div id="title">Peace Talk</div>
        <div id="chat-content"></div>
        <div id="input-area">
            <input type="text" id="user-id" placeholder="Enter your user ID" />
            <input type="text" id="user-input" placeholder="Type a message..." />
            <button id="send-button" onclick="sendMessage()">
                <img src="https://img.icons8.com/material-rounded/24/ffffff/send.png" alt="Send">
            </button>
            <button id="voice-button" onclick="toggleVoiceRecognition()">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/microphone.png" alt="Voice">
            </button>
        </div>
    </div>

    <div id="chat-toggle" onclick="toggleChat()">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/speech-bubble.png" alt="Chat">
    </div>

    <script>
        let recognizing = false;
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
            recognizing = true;
            console.log("Voice recognition started.");
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById("user-input").value = transcript;
            sendMessage();
        };

        recognition.onerror = function(event) {
            console.error("Speech recognition error:", event.error);
        };

        recognition.onend = function() {
            recognizing = false;
            console.log("Voice recognition ended.");
        };

        function toggleVoiceRecognition() {
            if (recognizing) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        async function sendMessage() {
            const userId = document.getElementById("user-id").value;
            const userInput = document.getElementById("user-input").value;
            if (userId.trim() === "" || userInput.trim() === "") return;

            displayMessage(userInput, "user");
            displayTypingIndicator();

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ user_id: userId, message: userInput })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                removeTypingIndicator();
                displayMessage(data.response, "bot");
            } catch (error) {
                console.error("Error:", error);
                removeTypingIndicator();
            }
        }

        function displayMessage(message, sender) {
            const chatContent = document.getElementById("chat-content");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = message;
            chatContent.appendChild(messageDiv);
            chatContent.scrollTop = chatContent.scrollHeight;
        }

        function displayTypingIndicator() {
            const chatContent = document.getElementById("chat-content");
            const typingDiv = document.createElement("div");
            typingDiv.className = "typing-indicator";
            typingDiv.id = "typing-indicator";
            typingDiv.innerHTML = `
                <span></span>
                <span></span>
                <span></span>
            `;
            chatContent.appendChild(typingDiv);
            chatContent.scrollTop = chatContent.scrollHeight;
        }

        function removeTypingIndicator() {
            const typingIndicator = document.getElementById("typing-indicator");
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        function toggleChat() {
            const chatbox = document.getElementById("chatbox");
            chatbox.classList.toggle("show");
        }
    </script>
</body>
</html>
